version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: medi_explainer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: medi_explainer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medi_explainer"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medi_explainer_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=AI Medical Report Explainer
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+psycopg://postgres:postgrespassword@db:5432/medi_explainer
      - SECRET_KEY=prod-secret-key-change-this-for-production-deployment
      - LLM_PROVIDER=mock
      - UPLOAD_DIR=/app/data/uploads
    volumes:
      - uploads_data:/app/data/uploads
    command: >
      sh -c "alembic upgrade head &&
             python scripts/ingest_references.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
  uploads_data:
